name: Go build
description: Build a binary with go
inputs:
  CGO_ENABLED:
    description: Enable CGO
    required: false
    default: "0" # disabled

runs:
  using: "composite"
  steps:
    - name: Setup cache
      id: cache
      shell: sh
      run: |
        if [ -f "go.sum" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache: ${{ steps.cache.outputs.enabled }}
    - shell: sh
      env:
        CGO_ENABLED: ${{ inputs.CGO_ENABLED }}
      run: go build
