name: go build
description: Build a binary with go

runs:
  using: "composite"
  steps:
    - name: Check for go.sum
      id: cache
      shell: sh
      run: |
        if [ -f "go.sum" ]; then
          echo "enabled=${{ inputs.cache }}" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: "go.mod"
        cache: ${{ steps.cache.outputs.enabled }}
    - shell: sh
      run: go build
