name: go build
description: Build a binary with go

runs:
  using: "composite"
  steps:
    - name: Check for go.sum
      id: go
      shell: sh
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        if [ -f "go.sum" ]; then
          echo "sum=${{ inputs.cache }}" >> "$GITHUB_OUTPUT"
        else
          echo "sum=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: "go.mod"
        cache: ${{ steps.go.outputs.sum }}
    - name: Cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.go.outputs.build }}
        key: ${{ runner.os }}-${{ hashFiles('go.mod') }}
    - shell: sh
      run: go build
