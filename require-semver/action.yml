name: Require Semver Label
description: "Ensures PR has exactly one semver label (major, minor, or patch)"
inputs:
  error-message:
    description: "Message to echo upon failure"
    required: false
    default: "PR must have exactly one of the following labels: major, minor, patch"
runs:
  using: "composite"
  steps:
    - name: Get labels
      id: label
      uses: anttiharju/actions/get-labels@v0

    - name: Check for major label
      id: major
      uses: anttiharju/actions/require-label@v0
      with:
        labels: ${{ steps.label.outputs.names }}
        name: "major"
        error-message: ${{ inputs.error-message }}

    - name: Check for minor label
      id: minor
      uses: anttiharju/actions/require-label@v0
      with:
        labels: ${{ steps.label.outputs.names }}
        name: "minor"
        error-message: ${{ inputs.error-message }}
        fail-on-match: ${{ steps.major.outputs.is-set }}

    - name: Check for patch label
      id: patch
      uses: anttiharju/actions/require-label@v0
      with:
        labels: ${{ steps.label.outputs.names }}
        name: "patch"
        error-message: ${{ inputs.error-message }}
        fail-on-match: ${{ steps.minor.outputs.is-set }}

    - name: Verify that at least one semver label is set
      shell: sh
      env:
        MAJOR_FOUND: ${{ steps.major.outputs.is-set }}
        MINOR_FOUND: ${{ steps.minor.outputs.is-set }}
        PATCH_FOUND: ${{ steps.patch.outputs.is-set }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
      run: |
        if [[ "$MAJOR_FOUND" == "false" && "$MINOR_FOUND" == "false" && "$PATCH_FOUND" == "false" ]]; then
          echo "Error: $ERROR_MESSAGE"
          exit 1
        fi
