name: runner-paths
permissions: {}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paths:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-slim
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - ubuntu-26.04-arm
          - macos-14
          - macos-15
          - macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            find-changes-action

      - name: Find changes
        id: changes
        uses: ./find-changes-action

      - name: Compare changes
        uses: anttiharju/compare-changes-action@v0
        with:
          changes: ${{ steps.changes.outputs.array }}
          paths: |
            .github/workflows/**
