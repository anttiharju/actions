name: shellcheck
on:
  pull_request:
    paths:
      - ".github/workflows/shellcheck.yml"
      - "shellcheck/**/*"
      - "!shellcheck/README.md"
  push:
    branches:
      - v0
    paths:
      - ".github/workflows/shellcheck.yml"
      - "shellcheck/**/*"
      - "!shellcheck/README.md"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        working-directory: shellcheck
        shell: sh
        run: ./test.py
