on:
  pull_request:
  push:
    branches:
      - v0

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: action-validator
        uses: ./action-validator

      - if: always()
        name: actionlint
        uses: ./actionlint

      - if: always()
        name: ShellCheck
        uses: ./shellcheck

      - if: always()
        name: check-relative-markdown-links
        uses: ./check-relative-markdown-links

      - if: always()
        name: Prettier
        uses: ./prettier

      - if: always()
        name: EditorConfig-Checker
        uses: ./editorconfig-checker
