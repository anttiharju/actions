name: find-changes
on:
  pull_request:
    paths:
      - ".github/workflows/find-changes.yml"
      - "find-changes/**/*"
      - "!find-changes/README.md"
  push:
    branches:
      - v0
    paths:
      - ".github/workflows/find-changes.yml"
      - "find-changes/**/*"
      - "!find-changes/README.md"

jobs:
  example:
    name: Example
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find changes
        id: changed
        uses: ./find-changes

      - name: Echo changed files
        shell: sh
        run: |
          echo ${{ steps.changed.outputs.files }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        working-directory: find-changes
        run: |
          ./test.py
