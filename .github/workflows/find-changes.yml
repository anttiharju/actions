name: find-changes
on:
  pull_request:
    paths:
      - ".github/workflows/find-changes.yml"
      - "find-changes/**/*"
      - "!find-changes/README.md"
  push:
    branches:
      - v0
    paths:
      - ".github/workflows/find-changes.yml"
      - "find-changes/**/*"
      - "!find-changes/README.md"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changes
        uses: ./find-changes
        with:
          glob-from: "find-changes/testdata/lefthook.yml:pre-commit.jobs.go-build.glob"
