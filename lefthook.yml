output:
  - success
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: action-validator
      run: git ls-files -z '.github/*/*.yml' '*/action.yml' | xargs -0 action-validator --verbose

    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: actionlint -color {staged_files}

    # https://github.com/anttiharju/check-relative-markdown-links
    - name: check-relative-markdown-links
      run: check-relative-markdown-links run

    - name: Prettier
      glob: "*{.md,.yml}"
      run: prettier --write {staged_files}
      stage_fixed: true

    - name: EditorConfig-Checker
      run: editorconfig-checker {staged_files}

    - name: Ruff
      glob: "*.py"
      run: |
        ruff check --fix {staged_files}
        ruff format {staged_files}
      stage_fixed: true
