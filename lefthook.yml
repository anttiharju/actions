output:
  - success
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: action-validator
      glob: "{.github/*/*.yml,*/action.yml}"
      run: action-validator --verbose {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.yml"
      run: actionlint -color {staged_files}

    # https://github.com/anttiharju/check-relative-markdown-links
    - name: check-relative-markdown-links
      run: check-relative-markdown-links run

    - name: Prettier
      glob: "*{.md,.yml}"
      run: prettier --write {staged_files}
      stage_fixed: true

    - name: EditorConfig-Checker
      run: editorconfig-checker {staged_files}
