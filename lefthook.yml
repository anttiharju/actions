output:
  - success
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: Test run-shellcheck
      run: ./run-shellcheck/test.py
      glob: "run-shellcheck/*"

    - name: Actions
      group:
        parallel: true
        jobs:
          - name: action-validator
            run: >
              find ./.github -type f -mindepth 2 -name "*.yml" -exec
              action-validator --verbose {} +
          - run: actionlint

    - name: ShellCheck
      glob: "*.sh"
      run: >
        shellcheck --color=always -x $(
          file {staged_files} |
          grep -i -E "POSIX shell script|sh script text executable|sh script, ASCII text executable|Bourne-Again shell script" |
          cut -d: -f1
        )

    - name: Markdown
      glob: "*.md"
      run: npx --yes markdown-link-check --quiet {staged_files} | (! grep .)

    - name: Prettier
      run: npx --yes prettier --write {staged_files}
      glob: "*{.md,.yml}"
      stage_fixed: true

    - name: EditorConfig
      run: git ls-files -z | npx --yes editorconfig-checker
