output:
  - success
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: Actions
      group:
        parallel: true
        jobs:
          - name: action-validator
            run: >
              find ./.github -type f -mindepth 2 -name "*.yml" -exec
              action-validator --verbose {} +
          - run: actionlint

    - name: Markdown
      glob: "*.md"
      run: npx --yes markdown-link-check --quiet {staged_files} | (! grep .)

    - name: Prettier
      run: npx --yes prettier --write {staged_files}
      glob: "*{.md,.yml}"
      stage_fixed: true

    - name: EditorConfig-Checker
      run: npx --yes editorconfig-checker {staged_files}
