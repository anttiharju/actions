name: relcheck
description: Runs relcheck on default settings
inputs:
  sha:
    required: false
    description: "SHA of the commit from which to install the tool"
    default: f79dc07684109baed16d10dd8ff2ade9bb94ce22

runs:
  using: "composite"
  steps:
    - name: Check relative markdown links
      shell: sh
      env:
        sha: ${{ inputs.sha }}
      run: |
        curl -sSfL "https://raw.githubusercontent.com/anttiharju/relcheck/$sha/relcheck.bash" | bash -s -- run --verbose --color=always
