name: Simple Python Match
description: Test matching Python files with basic regex
env:
  GITHUB_EVENT_NAME: push
  REGEX: ".*\\.py$"
  EXISTING_MATRIX: "[]"
input_files:
  - path: src/file1.py
  - path: src/file2.txt
  - path: tests/test1.py
expected_output:
  matrix:
    - name: file1
      path: src
    - name: test1
      path: tests
