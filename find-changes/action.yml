name: "Find changes"
description: "Find changes in files to enable conditional runs of CI jobs based on what files have changed within a PR or merge"
author: "anttiharju"

inputs:
  glob:
    description: "Path to YAML file and key path (e.g. 'lefthook.yml:pre-commit.jobs.name.glob') to extract glob pattern for matching changed files"
    required: true

runs:
  using: "composite"
  steps:
    - name: Find and process changed files
      id: find-changes
      shell: sh
      env:
        glob: ${{ inputs.glob }}
      run: |
        "$GITHUB_ACTION_PATH/action.py"

outputs:
  changes:
    description: "JSON array of objects containing information about changed files that match the extracted glob patterns"
    value: ${{ steps.find-changes.outputs.matrix }}

branding:
  icon: "git-pull-request"
  color: "blue"
