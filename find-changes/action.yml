name: "Find changes"
description: "Outputs changed files in JSON format for downstream actions"
author: "anttiharju"

runs:
  using: "composite"
  steps:
    - name: Find changes
      id: changed
      shell: sh
      run: |
        git reset --hard
        "$GITHUB_ACTION_PATH/action.py"

outputs:
  files:
    description: "List of changed files in JSON format"
    value: ${{ steps.changed.outputs.files }}

branding:
  icon: "git-pull-request"
  color: "blue"
