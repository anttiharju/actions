name: "Find changes"
description: "Outputs changed files in JSON format for downstream actions"
author: "anttiharju"

runs:
  using: "composite"
  steps:
    - name: Find changes
      id: changes
      shell: sh
      run: |
        git reset --hard
        "$GITHUB_ACTION_PATH/action.py"

outputs:
  array:
    description: "JSON array of changed files"
    value: ${{ steps.changes.outputs.files }}

branding:
  icon: "git-pull-request"
  color: "blue"
