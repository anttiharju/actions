name: "Find changes"
description: "Find changes in files to enable conditional runs of CI jobs based on what files have changed within a PR or merge"
author: "anttiharju"

inputs:
  regex:
    description: "Regex pattern to match files that have changed"
    required: true
  match_all_regex:
    description: "If files matching this regex have changed, include all files matching the main regex in the output"
    required: false
  exclude-regex:
    description: "Regex pattern to exclude matched files, useful for excluding sample apps or test files"
    required: false
  matrix:
    description: "Existing JSON matrix to append results to"
    required: false
    default: "[]"

outputs:
  changes:
    description: "JSON array of objects containing information about changed files that match the provided regex patterns"
    value: ${{ steps.find-changes.outputs.matrix }}

runs:
  using: "composite"
  steps:
    - name: Find and process changed files
      id: find-changes
      shell: bash
      env:
        REGEX: ${{ inputs.regex }}
        MATCH_ALL_REGEX: ${{ inputs.match_all_regex }}
        EXCLUDE_REGEX: ${{ inputs.exclude-regex }}
        EXISTING_MATRIX: ${{ inputs.matrix }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_SHA: ${{ github.sha }}
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_OUTPUT: ${{ github.output }}
      run: |
        python3 ${{ github.action_path }}/action.py

branding:
  icon: "git-pull-request"
  color: "blue"
