name: Check ShellCheck
description: Runs ShellCheck with forced color and external sources

runs:
  using: "composite"
  steps:
    - name: Run ShellCheck
      shell: sh
      run: >
        git ls-files --cached --exclude-standard -o -z
        | xargs -0 file | ${GITHUB_ACTION_PATH}/filter.py
        | cut -d: -f1 | xargs -I{} sh -c 'cd "$(dirname {})" &&
        shellcheck --color=always -x "$(basename {})"'
    - if: always()
      shell: sh
      run: shellcheck --version
